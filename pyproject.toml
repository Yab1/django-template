[project]
name = "ehr-backend"
version = "0.1.0"
description = "EHR Backend"
requires-python = ">=3.12"
dependencies = [
    # Core Framework
    "Django==5.2.13",
    # Environment and Configuration
    "django-environ==0.11.2",
    # Database and ORM
    "psycopg2-binary==2.9.10",
    # Security and Permissions
    "django-easy-audit==1.3.7",
    "django-simple-history==3.10.1",
    # JWT Authentication
    "djangorestframework-simplejwt==5.5.1",
    # Middleware and Utilities
    "whitenoise==6.5.0",
    "django-cors-headers==4.3.1",
    "django-extensions==3.2.3",
    # Image Processing
    "pillow==12.2.0",
    "reportlab==4.4.10",
    # REST API
    "djangorestframework==3.16.1",
    "rest-framework-generic-relations==2.2.0",
    "drf-spectacular==0.29.0",
    # Filtering and Querying (required by DRF for filtering support)
    "django-filter==25.2",
    # Schema generation (OpenAPI / CoreAPI)
    "PyYAML==6.0.3",
    "uritemplate==4.2.0",
    # Browsable API: Markdown and syntax highlighting
    "markdown==3.10.2",
    "pygments==2.20.0",
    # Object-level permissions
    "django-guardian==3.3.0",
    # File Storage
    "django-storages==1.14.2",
    "django-minio-storage==0.5.8",
    # Asynchronous Support
    "channels==4.1.0",
    "daphne==4.1.2",
    # HTTP Client
    "httpx==0.28.1",
    "requests==2.33.1",
    "cryptography==46.0.7",
    "cbor2==5.9.0",
    # Celery and Related Extensions
    "celery==5.5.3",
    "django-celery-results==2.6.0",
    "django-celery-beat==2.8.1",
    # Server and Deployment
    "gunicorn==22.0.0",
    "uvicorn[standard]==0.32.1",
    "setuptools==78.1.1",
    # Error Tracking
    "sentry-sdk==2.30.0",
    # Logging
    "python-json-logger==4.0.0",
    # Dev seed & tests: factories
    "factory-boy==3.3.3",
    "faker==40.11.1",
    "django-redis==6.0.0",
    "jinja2==3.1.6",
    "weasyprint==69.0",
    "channels-redis>=4.2,<5",
]

[project.optional-dependencies]
dev = [
    # Profiling
    "django-debug-toolbar==4.3.0",
    "django-silk==5.5.0",
    # Type checking
    "mypy==1.18.2",
    "django-stubs==6.0.1",
    "django-stubs-ext==6.0.1",
    # Linting
    "ruff==0.14.5",
    "pre-commit==3.6.2",
    # Styling and Logging
    "rich==14.1.0",
    # Testing Framework
    "pytest==9.0.3",
    "pytest-django==4.8.0",
    "pytest-asyncio==1.3.0",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    # Parallel Test Execution
    "pytest-xdist==3.5.0",
    # Test Timeout (prevent hanging tests)
    "pytest-timeout==2.2.0",
    # Dependency / security audit
    "pip-audit==2.10.0",
    # Local dev process runner (Procfile: Django, Celery)
    "honcho==2.0.0",
]

# General Settings
[tool.ruff]
line-length = 120
indent-width = 4
preview = true
target-version = "py312"
output-format = "grouped"
respect-gitignore = true
show-fixes = true
fix = true
unsafe-fixes = true
exclude = [ 
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "**/migrations/**",
    "node_modules",
    "site-packages",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = ["COM", "DJ", "E", "F", "I", "LOG", "N", "PIE", "Q", "RET", "T10", "T20", "W", "I001"]
ignore = ["DJ001", "E722", "COM812"]
fixable = ["ALL"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Per-file ignores
[tool.ruff.lint.per-file-ignores]
"**/migrations/**/*.py" = ["E501"]  # E501: Allow long lines in migration files (auto-generated)

# Formatting Settings
[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false

# Pydocstyle Settings
[tool.ruff.lint.pydocstyle]
convention = "google"

# Isort Settings
[tool.ruff.lint.isort]
case-sensitive = true
known-first-party = ["core", "config"]
known-third-party = ["django"]

# Mypy Settings
[tool.mypy]
plugins = [
    "mypy_django_plugin.main",
    "mypy_drf_plugin.main",
]

[tool.django-stubs]
django_settings_module = "config.django.base"

# Per-module overrides
[[tool.mypy.overrides]]
module = "config.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "core.*.migrations.*"
ignore_errors = true

# Basedpyright Settings
[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
extraPaths = [".venv/lib/python3.12/site-packages"]
reportMissingImports = "error"
useLibraryCodeForTypes = true
reportAttributeAccessIssue = false
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    ".venv",
    "venv",
    "migrations",
]
[dependency-groups]
dev = [
    "basedpyright>=1.38.3",
    "djangorestframework-stubs==3.16.1",
    "pydot>=4.0.1",
]

