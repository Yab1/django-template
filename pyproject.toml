[project]
name = "ehr-django-template"
version = "0.1.0"
description = "EHR Django Template"
requires-python = ">=3.12"
dependencies = [
    # Core Framework
    "Django==5.2.6",
    # Environment and Configuration
    "django-environ==0.11.2",
    # Database and ORM
    "psycopg2-binary==2.9.9",
    # Unfold Admin
    "django-unfold==0.69.0",
    # Security and Permissions
    "django-easy-audit==1.3.7",
    "django-simple-history==3.10.1",
    # Middleware and Utilities
    "whitenoise==6.5.0",
    "django-cors-headers==4.3.1",
    "django-extensions==3.2.3",
    # Image Processing
    "pillow==10.4.0",
    # Filtering and Querying
    "django-filter==23.5",
    # File Storage
    "django-storages==1.14.2",
    "django-minio-storage==0.5.8",
    # Asynchronous Support
    "channels==4.1.0",
    "daphne==4.1.2",
    # Celery and Related Extensions
    "celery==5.5.3",
    "django-celery-results==2.6.0",
    "django-celery-beat==2.8.1",
    # Server and Deployment
    "gunicorn==22.0.0",
    "uvicorn[standard]==0.32.1",
    "setuptools==70.3.0",
    # Error Tracking
    "sentry-sdk==2.30.0",
    # Professional Logging
    "django-guid",
    "python-json-logger",
    # GraphQL
    "strawberry-graphql==0.282.0",
    "strawberry-graphql-django==0.65.1",
    # YAML fixtures support
    "PyYAML==6.0.2",
    # Template engine for code generation
    "jinja2==3.1.6",
    # gRPC
    "django-grpc==1.1.2",
    # Private Git repositories (will be configured via UV_GIT_* env vars or uv auth)
    "django-tenant-db-router @ git+https://github.com/Yab1/django-tenant-db-router.git",
    "strawberry-django-keycloak-auth @ git+https://github.com/Yab1/strawberry-django-keycloak-auth.git",
]

[project.optional-dependencies]
dev = [
    "django-debug-toolbar==4.3.0",
    "mypy==1.18.2",
    "django-stubs==5.0.0",
    "ruff==0.14.5",
    "pre-commit==3.6.2",
    # Styling and Logging
    "rich==14.1.0",
    # Testing Framework
    "pytest==8.3.3",
    "pytest-django==4.8.0",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    # Test Data Generation
    "factory-boy==3.3.0",
    "faker==24.4.0",
    # Parallel Test Execution
    "pytest-xdist==3.5.0",
    # Test Timeout (prevent hanging tests)
    "pytest-timeout==2.2.0",
]

# General Settings
[tool.ruff]
line-length = 120
indent-width = 4
preview = true
target-version = "py312"
output-format = "grouped"
respect-gitignore = true
show-fixes = true
fix = true
unsafe-fixes = true
exclude = [ 
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "**/migrations/**",
    "node_modules",
    "site-packages",
    ".venv",
    "venv",
    "django_codegen",
]

[tool.ruff.lint]
select = ["COM", "DJ", "E", "F", "I", "LOG", "N", "PIE", "Q", "RET", "T10", "T20", "W", "I001"]
ignore = ["DJ001", "E722", "COM812"]
fixable = ["ALL"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Per-file ignores: Allow uppercase function names in gRPC service methods (required to match proto definitions)
[tool.ruff.lint.per-file-ignores]
"core/grpc/**/*service.py" = ["N802"]  # N802: Allow uppercase function names (required for gRPC service methods)
"core/fhir/**/*.py" = ["E501"]  # N802: Allow uppercase function names (required for FHIR service methods)
"**/migrations/**/*.py" = ["E501"]  # E501: Allow long lines in migration files (auto-generated)

# Formatting Settings
[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false

# Pydocstyle Settings
[tool.ruff.lint.pydocstyle]
convention = "google"

# Isort Settings
[tool.ruff.lint.isort]
case-sensitive = true
known-first-party = ["core", "config"]
known-third-party = ["django", "strawberry", "strawberry_django"]

# Mypy Settings
[tool.mypy]
plugins = [
    "mypy_django_plugin.main",
    "mypy_drf_plugin.main",
    "strawberry.ext.mypy_plugin",
]

[tool.django-stubs]
django_settings_module = "config.django.base"

# Per-module overrides
[[tool.mypy.overrides]]
module = "config.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "core.*.migrations.*"
ignore_errors = true

# Basedpyright Settings
[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
extraPaths = [".venv/lib/python3.12/site-packages"]
reportMissingImports = "error"
useLibraryCodeForTypes = true
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    ".venv",
    "venv",
    "migrations",
    "django_codegen",
]

[dependency-groups]
dev = [
    "ruff==0.14.5",
]
