name: vendor_management

x-django: &django_app
  build:
    context: ${DOCKER_BUILD_CONTEXT:-..}
    dockerfile: deployment/Dockerfile
  image: vendor_management:latest
  restart: on-failure
  networks:
    - vendor_management_network
    - tilla_infrastructure_network

x-worker: &worker_app
  <<: *django_app
  entrypoint: ["./deployment/worker-entrypoint.sh"]

services:
  vendor_management_blue:
    <<: *django_app
    container_name: vendor_management_blue

  vendor_management_green:
    <<: *django_app
    container_name: vendor_management_green

  vendor_management_celery:
    <<: *worker_app
    container_name: vendor_management_celery
    command:
      - celery
      - -A
      - config.settings.celery
      - worker
      - --loglevel=info

  vendor_management_celery_beat:
    <<: *worker_app
    container_name: vendor_management_celery_beat
    command:
      - celery
      - -A
      - config.settings.celery
      - beat
      - --loglevel=info

  vendor_management_temporal_worker:
    <<: *worker_app
    container_name: vendor_management_temporal_worker
    command:
      - python
      - -m
      - core.workflows.temporal.worker

  # Publishes :7000 for Nginx Proxy Manager. Routes to the active blue/green slot (see deploy.sh).
  vendor_management_proxy:
    image: nginx:1.27-alpine
    container_name: vendor_management_proxy
    ports:
      - "7000:80"
    volumes:
      - ./nginx/app-active.conf:/etc/nginx/conf.d/default.conf:ro
    restart: on-failure
    networks:
      - vendor_management_network
      - tilla_infrastructure_network

volumes:
  vendor_management_media:
    name: vendor_management_media

networks:
  vendor_management_network:
    name: vendor_management_network
    external: true

  tilla_infrastructure_network:
    name: tilla_infrastructure_network
    external: true
