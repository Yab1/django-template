name: django_template

x-django: &django_app
  build:
    context: ${DOCKER_BUILD_CONTEXT:-..}
    dockerfile: deployment/Dockerfile
  image: django_template:latest
  restart: on-failure
  networks:
    - django_template_network
    - tilla_infrastructure_network

x-worker: &worker_app
  <<: *django_app
  entrypoint: ["./deployment/worker-entrypoint.sh"]

services:
  django_template_blue:
    <<: *django_app
    container_name: django_template_blue

  django_template_green:
    <<: *django_app
    container_name: django_template_green

  django_template_celery:
    <<: *worker_app
    container_name: django_template_celery
    command:
      - celery
      - -A
      - config.settings.celery
      - worker
      - --loglevel=info

  django_template_celery_beat:
    <<: *worker_app
    container_name: django_template_celery_beat
    command:
      - celery
      - -A
      - config.settings.celery
      - beat
      - --loglevel=info

  # Publishes :6000 for Nginx Proxy Manager. Routes to the active blue/green slot (see deploy.sh).
  django_template_proxy:
    image: nginx:1.27-alpine
    container_name: django_template_proxy
    ports:
      - "6000:80"
    volumes:
      - ./nginx/app-active.conf:/etc/nginx/conf.d/default.conf:ro
    restart: on-failure
    networks:
      - django_template_network
      - tilla_infrastructure_network

volumes:
  django_template_media:
    name: django_template_media

networks:
  django_template_network:
    name: django_template_network
    external: true

  tilla_infrastructure_network:
    name: tilla_infrastructure_network
    external: true
