# Base codegen configuration
# Global settings that apply to ALL code generation modules (graphql, testing, admin, postman, etc.)
version: "1.0.0"

# Global settings that apply to all code generation
global:
  project_name: "ehr-django-template"
  base_app_path: "core"
  output_base_path: "core"
  python_path: "python3"
  import_prefix: "core"
  default_pagination_limit: 10
  max_pagination_limit: 100
  use_async: true
  use_type_checking: true

# Fields and types to exclude from generation (common across all modules)
exclusions:
  base_fields:
    - "id"
    - "created_at"
    - "updated_at"
  field_types: []
  apps: []
  models: []

# Hooks for custom code execution during generation (not yet implemented)
hooks:
  pre_generation: null
  post_generation: null
  pre_model_generation: null
  post_model_generation: null
