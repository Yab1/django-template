[pytest]
DJANGO_SETTINGS_MODULE = config.django.test
python_files = tests.py test_*.py *_tests.py
python_classes = Test* *Tests
python_functions = test_*
addopts =
    --reuse-db
    --nomigrations
    --cov=core
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    # Raise later (e.g. 80) when you want to enforce minimum coverage
    --cov-fail-under=0
    --strict-markers
    --tb=short
    -v
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, with database)
    slow: Slow running tests
    requires_db: Tests that require database
asyncio_mode = auto

